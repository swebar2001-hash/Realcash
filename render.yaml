services:
  - type: web
    name: realcash-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt greenlet pytest-asyncio email-validator
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
